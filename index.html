<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My first Web page</title>
  <!-- Link to your separate CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Welcome to my website.</h1>
  <p>I am learning <em><strong>HTML</strong></em> step by step</p>
  <p><a href="https://google.com">Google</a> to search for things.</p>

  <h2>My animal</h2>
  <img src="https://tinyurl.com/tv9w5f5y" alt="A dog image">

  <h2 class="food-heading">I like foods</h2>
  <ul>
    <li>icecream</li>
    <li>mango</li>
  </ul>

  <h2>My Schedule</h2>
  <table border="2">
    <tr>
      <th>day</th>
      <th>activity</th>
    </tr>
    <tr>
      <td>Monday</td>
      <td>Learn HTML</td>
    </tr>
    <tr>
      <td>Tuesday</td>
      <td>Practice Coding</td>
    </tr>
  </table>

  <br>
  <h2>COMMENT</h2>
  
  <!-- The form tag routes your data to process.php using the secure POST method -->
  <form action="process.php" method="POST">
    <!-- PHP reads the text using the 'name' attribute below -->
    <input type="text" id="userInput" name="userComment" placeholder="type...............">
    
    <!-- This button triggers both JavaScript (onscreen) and PHP (server submission) -->
    <button type="submit" onclick="displayComment()">Submit to Server</button>
  </form>

  <!-- This paragraph is where JavaScript outputs text instantly -->
  <p id="commentOutput"></p>

  <!-- Link to your separate JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
